[package]
name = "retifs-music-core"
description = "Music on retifs: tracks, albums and their covers in the user's libraries, through libretifs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libretifs = { path = "../../retifs/crates/libretifs" }
tokio = { version = "1", features = ["rt"] }
# Album keys as the Music Assistant provider makes them (its saved covers say `cover.album=<key>`).
sha2 = "0.10"
